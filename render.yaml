# Render blueprint for the ask service. The web app deploys elsewhere (Vercel) and reaches this
# over ASK_SERVICE_URL; the two share ASK_SERVICE_TOKEN.
#
#   Render dashboard -> New -> Blueprint -> pick this repo -> branch main
#
# `plan: free` is load-bearing. Free instances cannot mount disks, and this service needs none:
# the agent writes to a temp directory that is deleted once the answer has been streamed out.
# A free instance sleeps after fifteen minutes idle and takes about a minute to wake.

services:
  - type: web
    name: ephemeris-ask
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: VIDEO_DB_API_KEY
        sync: false
      - key: VIDEODB_COLLECTION_ID
        sync: false
      # Shared with the web app. Unset, the service refuses every ask.
      - key: ASK_SERVICE_TOKEN
        generateValue: true
